name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  issues: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: backend/Timesheets.slnx

    - name: Restore dependencies
      run: dotnet restore Timesheets.slnx

    - name: Check formatting
      run: dotnet format Timesheets.slnx --verify-no-changes --no-restore

    - name: Audit dependencies
      shell: bash
      run: |
        set -euo pipefail
        dotnet list Timesheets.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
        if grep -Eiq '\b(Critical|High)\b' vulnerable-packages.txt; then
          echo "High/Critical vulnerabilities found."
          exit 1
        fi

    - name: Build
      run: dotnet build Timesheets.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Timesheets.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Publish
      run: dotnet publish Timesheets.Api/Timesheets.Api.csproj --no-restore --no-build --configuration Release --output .ci/publish /p:UseAppHost=false

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: backend-publish
        path: ./backend/.ci/publish

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() }}
      with:
        name: .NET Unit Tests
        path: './backend/**/TestResults/test-results.trx'
        reporter: dotnet-trx

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Audit dependencies
      run: npm audit --audit-level=high --package-lock-only

    - name: Install dependencies
      run: npm ci

    - name: Check formatting
      run: npx biome check .

    - name: Build
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: frontend-dist
        path: ./frontend/dist

  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        name: backend-publish
        path: ./backend/.ci/publish

    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        name: frontend-dist
        path: ./frontend/.ci/dist

    - name: Build containers
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

    - name: Start containers
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

    - name: Wait for backend
      shell: bash
      run: |
        set -euo pipefail
        compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
        for i in {1..30}; do
          if curl -fsS "http://localhost:5000/health" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Backend health check failed."
        $compose ps
        $compose logs timesheets.backend --no-color | tail -n 200
        exit 1

    - name: Wait for frontend
      shell: bash
      run: |
        set -euo pipefail
        compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
        for i in {1..30}; do
          if curl -fsS "http://localhost:3000/" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Frontend did not become ready."
        $compose ps
        $compose logs timesheets.frontend --no-color | tail -n 200
        exit 1

    - name: Prepare ZAP report
      shell: bash
      run: |
        set -euo pipefail
        touch zap.yaml report_json.json report_md.md report_html.html
        chmod a+rw zap.yaml report_json.json report_md.md report_html.html

    - name: Run ZAP scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: "http://localhost:3000"
        fail_action: false
        artifact_name: zap-scan

    - name: Upload ZAP report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: zap-security-report
        path: |
          report_html.html
          report_md.md
          report_json.json

    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
