services:
  timesheets.backend:
    container_name: timesheets.backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__Database=Host=timesheets.database;Port=5432;Database=timesheets;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Include Error Detail=true
      - Authentication__ClientId=${AUTHENTICATION__CLIENTID:-vykazy.ondrejsvorc.cz}
      - Authentication__ClientSecret=${AUTHENTICATION__CLIENTSECRET:-}
      - Authentication__MetadataAddress=${AUTHENTICATION__METADATAADDRESS:-https://idp.ujep.cz/.well-known/openid-configuration}
      - Authentication__Issuer=${AUTHENTICATION__ISSUER:-https://idp.ujep.cz}
      - Authentication__CallbackPath=${AUTHENTICATION__CALLBACKPATH:-/login-oidc}
      - Authentication__SignedOutCallbackPath=${AUTHENTICATION__SIGNEDOUTCALLBACKPATH:-/logout-oidc}
      - Authentication__RemoteSignOutPath=${AUTHENTICATION__REMOTESIGNOUTPATH:-/auth/logout-callback}
      - Authentication__SignedOutRedirectUri=${AUTHENTICATION__SIGNEDOUTREDIRECTURI:-/login}
      - Authentication__Scope__0=openid
      - Authentication__Scope__1=profile
      - Authentication__Scope__2=email
      - Authentication__Scope__3=offline_access
      - Authentication__Scope__4=personalNumber
      - Authentication__Scope__5=title
    ports:
      - "5000:5000"
    depends_on:
      timesheets.database:
        condition: service_healthy

  timesheets.frontend:
    container_name: timesheets.frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - timesheets.backend

  timesheets.database:
    image: postgres:17-alpine
    container_name: timesheets.database
    environment:
      - POSTGRES_DB=timesheets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./.containers/timesheets-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  timesheets.pgAdmin:
    image: dpage/pgadmin4
    container_name: timesheets.pgAdmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - ./.containers/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - timesheets.database
