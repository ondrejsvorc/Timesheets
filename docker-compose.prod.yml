services:
  timesheets.database:
    image: postgres:17-alpine
    container_name: timesheets.database
    environment:
      POSTGRES_DB: timesheets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - timesheets_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  timesheets.backend:
    container_name: timesheets.backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5000"
      ConnectionStrings__Database: Host=timesheets.database;Port=5432;Database=timesheets;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Authentication__ClientId: ${AUTHENTICATION__CLIENTID:-vykazy.ondrejsvorc.cz}
      Authentication__ClientSecret: ${AUTHENTICATION__CLIENTSECRET}
      Authentication__MetadataAddress: ${AUTHENTICATION__METADATAADDRESS:-https://idp.ujep.cz/.well-known/openid-configuration}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER:-https://idp.ujep.cz}
      Authentication__CallbackPath: ${AUTHENTICATION__CALLBACKPATH:-/login-oidc}
      Authentication__SignedOutCallbackPath: ${AUTHENTICATION__SIGNEDOUTCALLBACKPATH:-/logout-oidc}
      Authentication__RemoteSignOutPath: ${AUTHENTICATION__REMOTESIGNOUTPATH:-/auth/logout-callback}
      Authentication__SignedOutRedirectUri: ${AUTHENTICATION__SIGNEDOUTREDIRECTURI:-/login}
      Authentication__Scope__0: openid
      Authentication__Scope__1: profile
      Authentication__Scope__2: offline_access
      Authentication__Scope__3: personalNumber
      Authentication__Scope__4: title
    depends_on:
      timesheets.database:
        condition: service_healthy
    restart: unless-stopped

  timesheets.frontend:
    container_name: timesheets.frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped

  timesheets.nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: timesheets.nginx
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - timesheets.frontend
      - timesheets.backend
    restart: unless-stopped

  timesheets.certbot:
    build:
      context: ./deploy/certbot
      dockerfile: Dockerfile
    container_name: timesheets.certbot
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  timesheets_db:
  letsencrypt:
  webroot:

