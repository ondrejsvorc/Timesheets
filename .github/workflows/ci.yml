name: CI (quality, security, runtime)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  backend:
    name: "Backend (.NET): format, analyzers, tests, vulnerability scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: backend/Timesheets.slnx

    - name: Restore dependencies
      run: dotnet restore Timesheets.slnx

    - name: Verify formatting (no changes)
      run: dotnet format Timesheets.slnx --verify-no-changes

    - name: Check vulnerable packages (.NET)
      shell: bash
      run: |
        set -euo pipefail
        dotnet list Timesheets.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
        if grep -Eiq '\b(Critical|High)\b' vulnerable-packages.txt; then
          echo "High/Critical vulnerabilities found."
          exit 1
        fi

    - name: Build
      run: dotnet build Timesheets.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Timesheets.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Test Report
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: .NET Unit Tests
        path: './backend/**/TestResults/test-results.trx'
        reporter: dotnet-trx

  frontend:
    name: "Frontend: biome check + npm audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Biome check (no writes)
      run: npx biome check .

    - name: Audit dependencies
      run: npm audit --audit-level=high

  runtime:
    name: "Runtime (Docker Compose): health checks + ZAP DAST"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build containers
      run: docker compose build

    - name: Start containers
      run: docker compose up -d

    - name: Wait for backend health
      shell: bash
      run: |
        set -euo pipefail
        for i in {1..30}; do
          if curl -fsS "http://localhost:5000/health" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Backend health check failed."
        docker compose ps
        docker compose logs timesheets.backend --no-color | tail -n 200
        exit 1

    - name: Wait for frontend
      shell: bash
      run: |
        set -euo pipefail
        for i in {1..30}; do
          if curl -fsS "http://localhost:3000/" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Frontend did not become ready."
        docker compose ps
        docker compose logs timesheets.frontend --no-color | tail -n 200
        exit 1

    - name: Prepare ZAP reports (permissions)
      shell: bash
      run: |
        set -euo pipefail
        touch zap.yaml report_json.json report_md.md report_html.html
        chmod a+rw zap.yaml report_json.json report_md.md report_html.html

    - name: ZAP baseline scan (DAST)
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: "http://localhost:3000"
        fail_action: true

    - name: Upload ZAP report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-security-report
        path: |
          report_html.html
          report_md.md
          report_json.json

    - name: Stop containers
      if: always()
      run: docker compose down -v
