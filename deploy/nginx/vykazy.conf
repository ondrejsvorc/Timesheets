map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name vykazy.ondrejsvorc.cz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name vykazy.ondrejsvorc.cz;

  ssl_certificate /etc/letsencrypt/live/vykazy.ondrejsvorc.cz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vykazy.ondrejsvorc.cz/privkey.pem;

  client_max_body_size 50m;

  add_header Content-Security-Policy "frame-ancestors 'self' https://idp.ujep.cz" always;

  location /auth/ {
    proxy_pass http://timesheets.backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # OIDC middleware callback endpoints must reach the backend (not the SPA).
  location = /login-oidc {
    proxy_pass http://timesheets.backend:5000/login-oidc;
    proxy_http_version 1.1;
    # OIDC sets multiple (sometimes large) Set-Cookie headers (nonce/correlation).
    # Default proxy buffers can be too small -> "upstream sent too big header".
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /logout-oidc {
    proxy_pass http://timesheets.backend:5000/logout-oidc;
    proxy_http_version 1.1;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SignalR hub is not under /api - it must be proxied explicitly.
  location /notifications/ {
    proxy_pass http://timesheets.backend:5000/notifications/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /api/ {
    proxy_pass http://timesheets.backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://timesheets.frontend:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

